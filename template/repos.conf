# ==================================================
# 対象リポジトリ定義
#
# 形式: <name> <clone-url> <base-branch>
#   name        … repos/ 配下に展開されるディレクトリ名
#   clone-url   … git clone 可能な URL（.bare/ に bare clone される）
#   base-branch … worktree の初期 ref。作業ブランチのベースになるブランチ
#
# '#' 始まりの行と空行は無視される。
# 追記して ./setup.sh を再実行すれば、あとから何度でもリポジトリを足せる。
#
# 記入例:
#   be-api   git@github.com:acme/be-api.git   develop
#   fe-web   git@github.com:acme/fe-web.git   main
#   infra    git@github.com:acme/infra.git    master
#
# repos/ 配下をカテゴリで分けたい場合は name にスラッシュを含めてよい:
#   be/api   git@github.com:acme/be-api.git   develop
#   fe/web   git@github.com:acme/fe-web.git   main
# ==================================================
